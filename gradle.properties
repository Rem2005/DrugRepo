# Toolchain note: Gradle 9.6 / AGP 9.4 require JDK 17+. This machine has Java 8 first on
# PATH, so the build must be pointed at a real JDK. That path is machine-specific and is
# therefore set OUTSIDE the repo, in the user-level ~/.gradle/gradle.properties:
#
#   org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.3.9-hotspot
#
# Android Studio may still use its bundled JBR unless Settings -> Build Tools -> Gradle ->
# Gradle JDK is changed. Both 21 and 25 satisfy AGP (min 17) and Gradle 9.6 (supports 17-27).

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.configuration-cache=true